<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#73513d"><link rel="manifest" href="manifest.webmanifest"><title>Mein Backbuch</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fbf8f4;color:#2d2925}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e9e1d9;padding:18px;position:sticky;top:0;z-index:2}.wrap{max-width:900px;margin:auto}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:23px;margin:0}h2{font-size:27px;margin:0 0 14px}h3{font-size:20px;margin:0 0 10px}main{padding:22px 16px 75px}p{line-height:1.5}.muted{color:#756b63}.card{background:white;border:1px solid #e9e1d9;border-radius:17px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #37270f07}button{border:0;border-radius:12px;background:#79533c;color:white;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;min-height:46px}button.alt{background:#eee7df;color:#42352b}button:disabled{opacity:.4}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.grow{flex:1}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:22px}.tabs button{white-space:nowrap;background:#eee7df;color:#42352b}.tabs button.active{background:#79533c;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.recipe{padding:0;overflow:hidden;text-align:left;color:inherit;background:white;width:100%;border:1px solid #e9e1d9}.recipe img{width:100%;height:185px;object-fit:cover}.recipe .inner{padding:16px}.hero{width:100%;max-height:300px;object-fit:cover;border-radius:14px}.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f2ede8;font-size:18px}.check input{width:23px;height:23px;accent-color:#688a61}input,textarea,select{font:inherit;padding:10px;border:1px solid #cdbfb2;border-radius:9px;background:white;max-width:100%}input[type=number]{width:85px}textarea{width:100%;min-height:95px}label.field{display:block;margin:12px 0 5px;font-weight:650}.full{width:100%}.step{font-size:clamp(22px,4vw,29px);line-height:1.5}.progress{height:9px;background:#ede4d9;border-radius:20px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#6b9164}.warning{background:#fff5df;border-radius:12px;padding:13px}.item{padding:12px 0;border-bottom:1px solid #eee5dd}.small{font-size:14px}.pill{border-radius:100px;background:#f1e9df;padding:7px 12px}.hidden{display:none}.stepbox{min-height:290px}.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid #eee7df}td:last-child{text-align:right}footer{color:#7b7269;font-size:13px;margin-top:25px}@media(max-width:500px){.card{padding:15px}button{padding:11px}header h1{font-size:20px}}
</style></head><body><header><div class="wrap"><h1>🍪 Mein Backbuch</h1><span class="muted small">Meine Weihnachtsbäckerei</span></div></header><main class="wrap"><nav class="tabs"><button id="tab-recipes" onclick="navigate('recipes')">📖 Rezepte</button><button id="tab-plan" onclick="navigate('plan')">🧁 Backplanung</button><button id="tab-shopping" onclick="navigate('shopping')">🛒 Einkaufsliste</button><button id="tab-data" onclick="navigate('data')">⚙️ Sicherung</button></nav><section id="content"></section><footer>Deine Rezepte und Planung werden auf diesem Gerät gespeichert. Sichere deine Daten regelmässig unter «Sicherung». Bei Browserdaten-Löschung können sie sonst verloren gehen.</footer></main><script>
const DEFAULT={"id": "cappuccino", "title": "Cappuccino-Monde", "category": "Weihnachtsguetzli", "yield": 55, "unit": "Stück", "image": "cappuccino.jpg", "note": "Anpassung auf Weizenmehl; Backzeit und Temperatur beim ersten Versuch prüfen.", "ingredients": [{"name": "Butter", "qty": 150, "unit": "g", "group": "Teig"}, {"name": "Puderzucker", "qty": 120, "unit": "g", "group": "Teig"}, {"name": "Ei (ganz)", "qty": 1, "unit": "Stück", "group": "Teig"}, {"name": "Vanillezucker", "qty": 1, "unit": "TL", "group": "Teig"}, {"name": "Weissmehl", "qty": 230, "unit": "g", "group": "Teig"}, {"name": "Maizena", "qty": 20, "unit": "g", "group": "Teig"}, {"name": "Mandeln, gemahlen", "qty": 80, "unit": "g", "group": "Teig"}, {"name": "Cappuccino-Instantpulver", "qty": 15, "unit": "g", "group": "Teig"}, {"name": "Mokka-Schokolade", "qty": 130, "unit": "g", "group": "Füllung"}, {"name": "Nougat", "qty": 75, "unit": "g", "group": "Füllung"}, {"name": "Mokka-Schokobohnen", "qty": 75, "unit": "g", "group": "Dekoration"}], "steps": [{"title": "Zutaten vorbereiten", "text": "Alle Zutaten abwiegen und die Butter weich werden lassen."}, {"title": "Buttermasse herstellen", "text": "150 g weiche Butter, 120 g Puderzucker, 1 Ei und 1 TL Vanillezucker kurz verrühren. Nicht schaumig schlagen."}, {"title": "Teig herstellen", "text": "230 g Weissmehl, 20 g Maizena, 80 g gemahlene Mandeln und 15 g Cappuccino-Instantpulver mischen. Kurz unter die Buttermasse arbeiten."}, {"title": "Kühlen", "text": "Teig in Folie wickeln und mindestens 3 Stunden, besser über Nacht, kühlen.", "timer": 10800}, {"title": "Ausstechen", "text": "Teig etwa 15–20 Minuten vor der Verarbeitung herausnehmen, 3 mm dünn ausrollen und ca. 7 cm lange Monde ausstechen."}, {"title": "Backen", "text": "Bei 180 °C Ober-/Unterhitze ca. 8–10 Minuten hell backen und vollständig auskühlen lassen. Beim ersten Blech die Backzeit kontrollieren.", "timer": 540}, {"title": "Füllen", "text": "130 g Mokka-Schokolade und 75 g Nougat im Wasserbad schmelzen. Je zwei Monde mit Füllung zusammensetzen."}, {"title": "Dekorieren", "text": "Mit Mokka-Schokobohnen verzieren und trocknen lassen."}]};const KEY='backbuch-2026-v3';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.recipes))state={recipes:[DEFAULT],plan:{},checked:{}};if(!state.recipes.some(r=>r.id===DEFAULT.id))state.recipes.unshift(DEFAULT);state.plan||={};state.checked||={};let page='recipes',current=null,step=0,timer=null,editing=null;
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>Number.isInteger(x)?String(x):String(Math.round(x*100)/100);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Speichern fehlgeschlagen. Bitte Sicherungsdatei erstellen.')}}function navigate(p){clearTimer();page=p;['recipes','plan','shopping','data'].forEach(t=>$('tab-'+t).classList.toggle('active',t===p));({recipes:showRecipes,plan:showPlan,shopping:showShopping,data:showData})[p]();window.scrollTo(0,0)}function recipe(id){return state.recipes.find(r=>r.id===id)}function image(r){return r.image==='cappuccino.jpg'?'<img src="cappuccino.jpg" alt="Cappuccino-Monde">':''}
function showRecipes(){$('content').innerHTML=`<div class="row between"><h2>Meine Rezepte</h2><button onclick="editRecipe()">+ Neues Rezept</button></div><div class="grid">${state.recipes.map(r=>`<button class="recipe" onclick="showRecipe('${r.id}')">${image(r)}<div class="inner"><strong>${esc(r.title)}</strong><p class="muted small">${esc(r.category||'Backen')} · ${r.yield} ${esc(r.unit||'Stück')}</p></div></button>`).join('')}</div>`}
function showRecipe(id){current=id;const r=recipe(id);$('content').innerHTML=`<button class="alt" onclick="navigate('recipes')">← Zurück</button><div class="card">${image(r).replace('<img ','<img class="hero" ')}<h2>${esc(r.title)}</h2><p class="muted">Für ca. ${r.yield} ${esc(r.unit||'Stück')}</p><div class="row"><button onclick="startBake()">▶ Schritt für Schritt backen</button><button class="alt" onclick="editRecipe('${id}')">Bearbeiten</button></div></div><div class="card"><h3>Zutaten</h3>${r.ingredients.map((x,i)=>`<label class="check"><input type="checkbox"><span>${esc(x.qty)} ${esc(x.unit)} ${esc(x.name)}</span></label>`).join('')}</div>${r.note?`<p class="warning">${esc(r.note)}</p>`:''}`}
function startBake(){step=0;renderStep()}function renderStep(){const r=recipe(current),s=r.steps[step];$('content').innerHTML=`<div class="row between"><button class="alt" onclick="showRecipe('${current}')">← Rezept</button><span class="pill">Schritt ${step+1} von ${r.steps.length}</span></div><div class="progress"><div style="width:${100*(step+1)/r.steps.length}%"></div></div><div class="card stepbox"><h2>${esc(s.title)}</h2><div class="step">${esc(s.text)}</div>${s.timer?`<div style="margin-top:22px"><div id="clock" class="timer">${formatTime(s.timer)}</div><div class="row"><button onclick="startTimer(${s.timer})">⏱ Timer starten</button><button class="alt" onclick="clearTimer()">Stoppen</button></div><p class="small muted">Timer funktioniert nur zuverlässig, solange die Seite aktiv bleibt. Für lange Kühlzeiten zusätzlich einen iPad-Wecker stellen.</p></div>`:''}</div><div class="row"><button class="alt grow" ${step===0?'disabled':''} onclick="move(-1)">← Zurück</button><button class="grow" onclick="move(1)">${step===r.steps.length-1?'✓ Fertig':'Weiter →'}</button></div>`}function move(n){clearTimer();if(n===1&&step===recipe(current).steps.length-1){showRecipe(current);return}step=Math.max(0,step+n);renderStep()}function formatTime(t){let h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function clearTimer(){if(timer)clearInterval(timer);timer=null}function startTimer(sec){clearTimer();let end=Date.now()+sec*1000;timer=setInterval(()=>{let remaining=Math.max(0,Math.ceil((end-Date.now())/1000));if($('clock'))$('clock').textContent=formatTime(remaining);if(!remaining){clearTimer();alert('Timer abgelaufen!')}},500)}
function showPlan(){$('content').innerHTML=`<h2>Backplanung</h2><p class="muted">Wähle für jedes Rezept die Anzahl der Teigmengen. 0 bedeutet: nicht backen.</p>${state.recipes.map(r=>`<div class="card row between"><div class="grow"><strong>${esc(r.title)}</strong><div class="small muted">1× ergibt ca. ${r.yield} ${esc(r.unit||'Stück')}</div></div><button class="alt" onclick="changePlan('${r.id}',-1)">−</button><strong>${fmt(state.plan[r.id]||0)}×</strong><button onclick="changePlan('${r.id}',1)">+</button></div>`).join('')}<div class="card"><strong>Geplante Gesamtmenge: ${state.recipes.reduce((sum,r)=>sum+(state.plan[r.id]||0)*r.yield,0)} Stück</strong><p class="small muted">Für unterschiedliche Stückgrössen sind dies Näherungswerte.</p><button class="full" onclick="navigate('shopping')">Einkaufsliste berechnen →</button></div>`}function changePlan(id,delta){state.plan[id]=Math.max(0,Math.min(20,(state.plan[id]||0)+delta));save();showPlan()}
function totals(){const map=new Map();for(const r of state.recipes){let mult=state.plan[r.id]||0;if(!mult)continue;for(const i of r.ingredients){const name=i.name.trim().toLowerCase(),unit=i.unit.trim().toLowerCase(),key=name+'|'+unit;if(!map.has(key))map.set(key,{name:i.name,unit:i.unit,qty:0});map.get(key).qty+=Number(i.qty)*mult}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'de'))}
function eggSummary(rows){let whole=0,white=0,yolk=0;for(const x of rows){let n=x.name.toLowerCase().trim();if(n==='ei (ganz)'||n==='ei'||n==='eier'||n==='eier (ganz)')whole+=x.qty;else if(n==='eiweiss'||n==='eiweiß')white+=x.qty;else if(n==='eigelb')yolk+=x.qty}let additional=Math.max(Math.ceil(white),Math.ceil(yolk));return {whole,white,yolk,additional,total:Math.ceil(whole)+additional,whiteLeft:additional-white,yolkLeft:additional-yolk}}
function showShopping(){const all=totals(),egg=eggSummary(all),items=all.filter(x=>!['ei (ganz)','ei','eier','eier (ganz)','eiweiss','eiweiß','eigelb'].includes(x.name.toLowerCase().trim()));let eggUsed=egg.total>0;let text=`<h2>Einkaufsliste</h2><p class="muted">Gleiche Zutaten und Einheiten werden automatisch zusammengezählt. Bereits vorhandene Zutaten kannst du abhaken.</p>`;if(!all.length){$('content').innerHTML=text+'<div class="card">Wähle zuerst Rezepte in der Backplanung aus.</div>';return}if(eggUsed)text+=`<div class="card"><h3>🥚 Eier clever nutzen</h3><p><strong>${egg.total} Eier insgesamt</strong> (rechnerischer Mindestbedarf)</p><p>${fmt(egg.whole)} ganze Eier für Rezepte; zusätzlich ${egg.additional} Eier zum Trennen für ${fmt(egg.white)} Eiweiss und ${fmt(egg.yolk)} Eigelb.</p><p class="small muted">Aus den getrennten Eiern bleiben rechnerisch ${fmt(egg.whiteLeft)} Eiweiss und ${fmt(egg.yolkLeft)} Eigelb übrig. Annahme: ein Ei liefert ein Eiweiss und ein Eigelb. Bei Grammangaben oder unterschiedlichen Eiergrössen separat prüfen.</p></div>`;text+=`<div class="card"><h3>Zutaten</h3>${(eggUsed?[{name:'Eier (gesamt)',unit:'Stück',qty:egg.total}]:[]).concat(items).map((x,i)=>{let key=x.name+'|'+x.unit;return `<label class="check"><input type="checkbox" ${state.checked[key]?'checked':''} onchange="toggleCheck('${encodeURIComponent(key)}',this.checked)"><span>${fmt(x.qty)} ${esc(x.unit)} ${esc(x.name)}</span></label>`}).join('')}</div><div class="row"><button onclick="copyShopping()">📋 Liste kopieren</button><button class="alt" onclick="window.print()">🖨 Drucken</button></div>`;$('content').innerHTML=text}
function toggleCheck(encoded,checked){state.checked[decodeURIComponent(encoded)]=checked;save()}function shoppingText(){let rows=totals(),egg=eggSummary(rows),items=rows.filter(x=>!['ei (ganz)','ei','eier','eier (ganz)','eiweiss','eiweiß','eigelb'].includes(x.name.toLowerCase().trim()));return 'Einkaufsliste – Mein Backbuch\n'+(egg.total?`${egg.total} Stück Eier (inkl. ${egg.additional} zum Trennen)\n`:'')+items.map(x=>`${fmt(x.qty)} ${x.unit} ${x.name}`).join('\n')}async function copyShopping(){let s=shoppingText();try{await navigator.clipboard.writeText(s);alert('Einkaufsliste kopiert')}catch(e){prompt('Einkaufsliste zum Kopieren:',s)}}
function editRecipe(id){editing=id||null;let r=id?recipe(id):null;$('content').innerHTML=`<h2>${r?'Rezept bearbeiten':'Neues Rezept'}</h2><div class="card"><label class="field">Rezeptname</label><input class="full" id="name" value="${esc(r?.title||'')}"><label class="field">Anzahl Stück pro Grundrezept</label><input type="number" id="yield" min="1" value="${r?.yield||40}"><label class="field">Kategorie</label><input class="full" id="category" value="${esc(r?.category||'Weihnachtsguetzli')}"><h3>Zutaten</h3><p class="small muted">Eine Zutat pro Zeile, im Format: Menge | Einheit | Zutat. Beispiel: 3 | Stück | Eiweiss. Bitte «Ei (ganz)», «Eiweiss» oder «Eigelb» exakt so benennen, damit die Eierberechnung funktioniert.</p><textarea id="ingredients" style="min-height:190px">${esc(r?.ingredients.map(i=>`${i.qty} | ${i.unit} | ${i.name}`).join('\n')||'')}</textarea><h3>Arbeitsschritte</h3><p class="small muted">Jeden Schritt durch eine Leerzeile trennen.</p><textarea id="steps" style="min-height:220px">${esc(r?.steps.map(s=>s.text).join('\n\n')||'')}</textarea><div class="row"><button onclick="saveEdited()">Rezept speichern</button><button class="alt" onclick="navigate('recipes')">Abbrechen</button></div></div>`}
function saveEdited(){const title=$('name').value.trim(),yieldN=Number($('yield').value),lines=$('ingredients').value.trim().split('\n').filter(x=>x.trim()),steps=$('steps').value.trim().split(/\n\s*\n/).filter(Boolean);let ingredients=[];for(const line of lines){let bits=line.split('|').map(x=>x.trim());if(bits.length!==3||!Number.isFinite(Number(bits[0]))||Number(bits[0])<=0||!bits[1]||!bits[2]){alert('Zutat ungültig: '+line+'\nFormat: 150 | g | Butter');return}ingredients.push({qty:Number(bits[0]),unit:bits[1],name:bits[2],group:'Zutaten'})}if(!title||!yieldN||yieldN<1||!ingredients.length||!steps.length){alert('Bitte Rezeptname, Stückzahl, Zutaten und Arbeitsschritte eingeben.');return}let id=editing||'r'+Date.now(),r={id,title,yield:yieldN,unit:'Stück',category:$('category').value,ingredients,steps:steps.map((text,i)=>({title:'Schritt '+(i+1),text}))};state.recipes=editing?state.recipes.map(x=>x.id===id?r:x):[...state.recipes,r];save();showRecipe(id)}
function showData(){$('content').innerHTML=`<h2>Sicherung & Daten</h2><div class="card"><h3>Backbuch sichern</h3><p>Exportiere deine Rezepte, Backplanung und Einkaufsliste als JSON-Datei. Bewahre sie beispielsweise in iCloud Drive auf.</p><button onclick="exportData()">⬇ Sicherung herunterladen</button></div><div class="card"><h3>Sicherung wiederherstellen</h3><p class="warning">Achtung: Beim Einlesen werden alle aktuellen Rezepte und Planungen ersetzt.</p><input type="file" accept=".json,application/json" onchange="importData(event)"></div><div class="card"><h3>Datenschutz & Synchronisierung</h3><p>Die App benötigt für die Bedienung keine Anmeldung. Die Daten liegen ausschliesslich im lokalen Browser-Speicher dieses Geräts; andere Geräte werden nicht automatisch synchronisiert. Die veröffentlichte Webseite selbst ist ohne Zugangsschutz grundsätzlich über ihren Link erreichbar.</p></div>`}function exportData(){let b=new Blob([JSON.stringify({version:3,...state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Backbuch-Sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(e){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.recipes)||!data.recipes.every(r=>r.title&&Array.isArray(r.ingredients)&&Array.isArray(r.steps)))throw Error('Ungültige Sicherung');if(!confirm('Alle vorhandenen Rezepte und Planungen ersetzen?'))return;state={recipes:data.recipes,plan:data.plan||{},checked:data.checked||{}};save();navigate('recipes')}catch(err){alert('Sicherung konnte nicht gelesen werden: '+err.message)}}
navigate('recipes');
</script></body></html>
