const $=id=>document.getElementById(id),escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function listing(){const a=state.recipes; $('app').innerHTML=`<h2>Unsere Rezepte</h2><p class="muted">${a.length} Grundrezepte · Varianten direkt im Rezept · weitere Kategorien jederzeit möglich</p><div class="controls"><input id="query" placeholder="Rezept oder Stichwort suchen" oninput="filterCards()"><select id="cat" onchange="filterCards()"><option value="">Alle Kategorien</option>${[...new Set(a.map(r=>r.category))].map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</select><select id="tag" onchange="filterCards()"><option value="">Alle Stichwörter</option>${[...new Set(a.flatMap(r=>r.tags||[]))].map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</select></div><div class="grid" id="cards" style="margin-top:18px">${a.map(r=>`<article class="tile" data-search="${escapeHtml((r.title+' '+r.category+' '+(r.tags||[]).join(' ')).toLowerCase())}" data-cat="${escapeHtml(r.category)}" data-tags="${escapeHtml((r.tags||[]).join('|'))}" onclick="openRecipe('${r.id}')"><img src="${r.image}" alt="${escapeHtml(r.title)}"><div class="info"><h3>${escapeHtml(r.title)}</h3><span class="pill">${r.yield_} ${escapeHtml(r.unit)}</span> ${r.variants?.length>1?`<span class="pill">${r.variants.length} Varianten</span>`:''}</div></article>`).join('')}</div>`}
function filterCards(){const q=$('query').value.toLowerCase(),c=$('cat').value,t=$('tag').value;document.querySelectorAll('.tile').forEach(e=>e.hidden=!(e.dataset.search.includes(q)&&(!c||e.dataset.cat===c)&&(!t||e.dataset.tags.split('|').includes(t))))}
function openRecipe(id){selected=id;variant=0;amount=rby(id).yield_;renderRecipe();window.scrollTo(0,0)}
function setVariant(n){variant=+n;renderRecipe()}
function setAmount(n){amount=Math.max(1,Math.round(Number(n)||1));renderRecipe()}
function renderRecipe(){const r=rby(selected),v=r.variants?.[variant],f=amount/r.yield_,ins=ingredients(r,variant);$('app').innerHTML=`<button class="alt" onclick="go('recipes')">← Alle Rezepte</button><div class="hero" style="margin-top:16px"><img src="${r.image}" alt="${escapeHtml(r.title)}"><div><h2>${escapeHtml(r.title)}</h2><p><span class="pill">${escapeHtml(r.category)}</span> ${(r.tags||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join('')}</p>${r.variants?.length?`<label>Variante<select style="display:block;width:100%" onchange="setVariant(this.value)">${r.variants.map((x,i)=>`<option value="${i}" ${i===variant?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></label>`:''}<label>Gewünschte Anzahl <input type="number" min="1" value="${amount}" onchange="setAmount(this.value)"></label><p class="muted">Grundrezept: ${r.yield_} ${escapeHtml(r.unit)}</p><button onclick="addPlan('${r.id}')">Zur Backplanung hinzufügen</button> <button class="alt" onclick="startBake()">▶ Backmodus</button><p><a href="${escapeHtml(r.source)}" target="_blank" rel="noopener">Originalquelle öffnen</a></p></div></div>${r.note?`<div class="notice card">${escapeHtml(r.note)}</div>`:''}${v?.note?`<div class="notice card">${escapeHtml(v.note)}</div>`:''}<section class="card"><h3>Zutaten für ${amount} ${escapeHtml(r.unit)}</h3><table class="ingredients">${ins.map(x=>`<tr><td>${fmt(x.qty*f)} ${escapeHtml(x.unit)}</td><td>${escapeHtml(x.name)}</td></tr>`).join('')}</table><p class="muted">Kleine Mengen (Eier, Prisen) können beim Skalieren gerundet werden müssen.</p></section><section class="card"><h3>Zubereitung</h3>${r.steps.map((s,i)=>`<div class="step"><b>${i+1}. ${escapeHtml(s.title)}</b><p>${escapeHtml(s.text)}</p></div>`).join('')}${v?.steps?.length?`<div class="notice"><b>Hinweise für ${escapeHtml(v.name)}</b>${v.steps.map(x=>`<p>${escapeHtml(x)}</p>`).join('')}</div>`:''}</section>`}
function addPlan(id){const r=rby(id);state.plan[id]={count:amount||r.yield_,variant:variant||0};save();alert('Zur Backplanung hinzugefügt.');}
function plan(){const ids=Object.keys(state.plan).filter(id=>rby(id));$('app').innerHTML=`<h2>Backplanung</h2><p>Hier legst du Mengen und Varianten für deine Einkaufsliste fest.</p>${ids.length?ids.map(id=>{const r=rby(id),p=state.plan[id];return `<div class="card"><div class="row between"><b>${escapeHtml(r.title)}</b><button class="alt" onclick="deletePlan('${id}')">Entfernen</button></div><div class="controls"><label>Anzahl <input type="number" min="1" value="${p.count}" onchange="editPlan('${id}','count',this.value)"></label>${r.variants?.length?`<label>Variante <select onchange="editPlan('${id}','variant',this.value)">${r.variants.map((v,i)=>`<option value="${i}" ${i===p.variant?'selected':''}>${escapeHtml(v.name)}</option>`).join('')}</select></label>`:''}</div></div>`}).join(''):'<div class="card">Noch keine Rezepte geplant. Öffne ein Rezept und wähle «Zur Backplanung hinzufügen».</div>'}<button onclick="go('shopping')">Einkaufsliste ansehen →</button>`}
function editPlan(id,k,val){state.plan[id][k]=+val;save();plan()}
function deletePlan(id){delete state.plan[id];save();plan()}
function shopping(){const totals={};for(const [id,p] of Object.entries(state.plan)){const r=rby(id);if(!r)continue;for(const x of ingredients(r,p.variant)){const key=x.name.toLowerCase()+'|'+x.unit;totals[key]||={name:x.name,unit:x.unit,qty:0};totals[key].qty+=x.qty*p.count/r.yield_}}const entries=Object.entries(totals).sort((a,b)=>a[1].name.localeCompare(b[1].name,'de'));$('app').innerHTML=`<h2>Einkaufsliste</h2><p class="muted">Summen aus der Backplanung. Unterschiedliche Bezeichnungen und Einheiten bleiben getrennt.</p>${entries.length?`<div class="card">${entries.map(([k,x])=>`<label class="checkrow ${state.checked[k]?'done':''}"><input type="checkbox" ${state.checked[k]?'checked':''} onchange="state.checked[${JSON.stringify(k)}]=this.checked;save();shopping()"><span>${fmt(x.qty)} ${escapeHtml(x.unit)} ${escapeHtml(x.name)}</span></label>`).join('')}</div><button onclick="print()">Drucken</button> <button class="alt" onclick="copyShopping()">Liste kopieren</button>`:'<div class="card">Bitte zuerst Rezepte zur Backplanung hinzufügen.</div>'}`}
function copyShopping(){const lines=[];for(const [id,p] of Object.entries(state.plan)){const r=rby(id);if(r)lines.push(r.title+': '+p.count+' '+r.unit)}navigator.clipboard?.writeText(lines.join('\n')).then(()=>alert('Planung kopiert.')).catch(()=>alert('Kopieren nicht verfügbar.'))}
function startBake(){stepIndex=0;renderBake()}
function renderBake(){clearTimer();const r=rby(selected),s=r.steps[stepIndex];$('app').innerHTML=`<button class="alt" onclick="renderRecipe()">← Rezept</button><div class="card" style="margin-top:18px"><p class="muted">${escapeHtml(r.title)} · Schritt ${stepIndex+1} von ${r.steps.length}</p><h2>${escapeHtml(s.title)}</h2><p style="font-size:21px;line-height:1.65">${escapeHtml(s.text)}</p>${s.timer?`<p>⏱ <span id="clock">${timeFmt(s.timer)}</span></p><button onclick="startTimer(${s.timer})">Timer starten</button> <button class="alt" onclick="clearTimer()">Stoppen</button><p class="muted">Für lange Kühlzeiten zusätzlich einen Gerätewecker verwenden.</p>`:''}</div><div class="row between"><button class="alt" onclick="moveStep(-1)" ${stepIndex===0?'disabled':''}>← Zurück</button><button onclick="moveStep(1)">${stepIndex===r.steps.length-1?'Fertig':'Weiter →'}</button></div>`}
function moveStep(n){const r=rby(selected);if(n>0&&stepIndex===r.steps.length-1){renderRecipe();return}stepIndex=Math.max(0,stepIndex+n);renderBake()}
function timeFmt(t){return `${Math.floor(t/3600)?Math.floor(t/3600)+':':''}${String(Math.floor(t%3600/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function clearTimer(){if(timer)clearInterval(timer);timer=null}
function startTimer(seconds){clearTimer();const end=Date.now()+seconds*1000;timer=setInterval(()=>{const remain=Math.max(0,Math.ceil((end-Date.now())/1000));if($('clock'))$('clock').textContent=timeFmt(remain);if(!remain){clearTimer();alert('Timer abgelaufen!')}},1000)}
function download(name,txt){const blob=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function data(){$('app').innerHTML=`<h2>Datensicherung</h2><div class="card"><p>Deine Backplanung und Änderungen werden auf diesem Gerät im Browser gespeichert. GitHub synchronisiert diese Daten nicht automatisch zwischen Geräten.</p><button onclick="download('mein-backbuch-sicherung.json',JSON.stringify(state,null,2))">Sicherung herunterladen</button><h3 style="margin-top:22px">Sicherung wiederherstellen</h3><input type="file" accept=".json,application/json" onchange="restore(event)"><p class="muted">Eine Sicherung überschreibt die aktuellen Daten dieser neuen Version.</p></div><div class="card"><h3>Zurück zum neuen Startbestand</h3><p>Nur die Daten dieser neuen Backbuch-Version werden zurückgesetzt. Alte Browserdaten bleiben unangetastet.</p><button class="alt" onclick="resetAll()">16 Grundrezepte wiederherstellen</button></div>`}
async function restore(e){try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.recipes))throw Error('Ungültige Datei');if(confirm('Aktuelle Daten durch diese Sicherung ersetzen?')){state=x;state.plan||={};state.checked||={};save();go('recipes')}}catch(err){alert('Sicherung konnte nicht gelesen werden: '+err.message)}}
function resetAll(){if(confirm('Neue Backbuchdaten zurücksetzen?')){state={recipes:structuredClone(SEED),plan:{},checked:{}};save();go('recipes')}}
go('recipes');
</script></body></html>
