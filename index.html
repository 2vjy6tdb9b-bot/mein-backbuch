</style></head><body><header><div class="wrap"><h1>🍪 Mein Backbuch</h1><span class="muted small">Meine Weihnachtsbäckerei</span></div></header><main class="wrap"><nav class="tabs"><button id="tab-recipes" onclick="navigate('recipes')">📖 Rezepte</button><button id="tab-plan" onclick="navigate('plan')">🧁 Backplanung</button><button id="tab-shopping" onclick="navigate('shopping')">🛒 Einkaufsliste</button><button id="tab-data" onclick="navigate('data')">⚙️ Sicherung</button></nav><section id="content"></section><footer>Deine Rezepte und Planung werden auf diesem Gerät gespeichert. Sichere deine Daten regelmässig unter «Sicherung». Bei Browserdaten-Löschung können sie sonst verloren gehen.</footer></main><script>
const DEFAULT={"id": "cappuccino", "title": "Cappuccino-Monde", "category": "Weihnachtsguetzli", "yield": 55, "unit": "Stück", "image": "cappuccino.jpg", "note": "Anpassung auf Weizenmehl; Backzeit und Temperatur beim ersten Versuch prüfen.", "ingredients": [{"name": "Butter", "qty": 150, "unit": "g", "group": "Teig"}, {"name": "Puderzucker", "qty": 120, "unit": "g", "group": "Teig"}, {"name": "Ei (ganz)", "qty": 1, "unit": "Stück", "group": "Teig"}, {"name": "Vanillezucker", "qty": 1, "unit": "TL", "group": "Teig"}, {"name": "Weissmehl", "qty": 230, "unit": "g", "group": "Teig"}, {"name": "Maizena", "qty": 20, "unit": "g", "group": "Teig"}, {"name": "Mandeln, gemahlen", "qty": 80, "unit": "g", "group": "Teig"}, {"name": "Cappuccino-Instantpulver", "qty": 15, "unit": "g", "group": "Teig"}, {"name": "Mokka-Schokolade", "qty": 130, "unit": "g", "group": "Füllung"}, {"name": "Nougat", "qty": 75, "unit": "g", "group": "Füllung"}, {"name": "Mokka-Schokobohnen", "qty": 75, "unit": "g", "group": "Dekoration"}], "steps": [{"title": "Zutaten vorbereiten", "text": "Alle Zutaten abwiegen und die Butter weich werden lassen."}, {"title": "Buttermasse herstellen", "text": "150 g weiche Butter, 120 g Puderzucker, 1 Ei und 1 TL Vanillezucker kurz verrühren. Nicht schaumig schlagen."}, {"title": "Teig herstellen", "text": "230 g Weissmehl, 20 g Maizena, 80 g gemahlene Mandeln und 15 g Cappuccino-Instantpulver mischen. Kurz unter die Buttermasse arbeiten."}, {"title": "Kühlen", "text": "Teig in Folie wickeln und mindestens 3 Stunden, besser über Nacht, kühlen.", "timer": 10800}, {"title": "Ausstechen", "text": "Teig etwa 15–20 Minuten vor der Verarbeitung herausnehmen, 3 mm dünn ausrollen und ca. 7 cm lange Monde ausstechen."}, {"title": "Backen", "text": "Bei 180 °C Ober-/Unterhitze ca. 8–10 Minuten hell backen und vollständig auskühlen lassen. Beim ersten Blech die Backzeit kontrollieren.", "timer": 540}, {"title": "Füllen", "text": "130 g Mokka-Schokolade und 75 g Nougat im Wasserbad schmelzen. Je zwei Monde mit Füllung zusammensetzen."}, {"title": "Dekorieren", "text": "Mit Mokka-Schokobohnen verzieren und trocknen lassen."}]};const MAILAENDERLI={"id": "mailaenderli", "title": "Mailänderli", "category": "Weihnachtsguetzli", "yield": 80, "unit": "Stück", "note": "Originalrezept aus dem fotografierten Backbuch. 200 °C, ca. 10 Minuten in der Ofenmitte. Variante: Für Hagelzucker mit leicht verklopftem Eiweiss bestreichen und bestreuen. Tipp aus dem Buch: Übrig gebliebenes Eigelb zum Bestreichen verwenden (3 Eigelb, 1 Ei und 3–4 EL Milch).", "ingredients": [{"name": "Butter oder Margarine", "qty": 250, "unit": "g", "group": "Teig"}, {"name": "Zucker", "qty": 225, "unit": "g", "group": "Teig"}, {"name": "Salz", "qty": 1, "unit": "Prise", "group": "Teig"}, {"name": "Ei (ganz)", "qty": 3, "unit": "Stück", "group": "Teig"}, {"name": "Zitrone (Schale)", "qty": 1, "unit": "Stück", "group": "Teig"}, {"name": "Weissmehl", "qty": 500, "unit": "g", "group": "Teig"}, {"name": "Eigelb", "qty": 1, "unit": "Stück", "group": "Bestreichen"}], "steps": [{"title": "Butter vorbereiten", "text": "250 g Butter oder Margarine in einer Schüssel weich rühren."}, {"title": "Zucker und Eier einrühren", "text": "225 g Zucker, 1 Prise Salz und 3 Eier beigeben. Rühren, bis die Masse hell ist."}, {"title": "Zitrone und Mehl", "text": "Schale von 1 Zitrone abreiben und beigeben. 500 g Mehl zugeben und zu einem Teig zusammenfügen."}, {"title": "Teig kühl stellen", "text": "Den Teig zugedeckt etwa 2 Stunden kühl stellen.", "timer": 7200}, {"title": "Ausrollen und ausstechen", "text": "Teig portionenweise auf wenig Mehl 5 mm dick ausrollen. Verschiedene Formen ausstechen und auf ein mit Backpapier belegtes Blech legen."}, {"title": "Guetzli kühlen", "text": "Ausgestochene Guetzli auf dem Blech etwa 15 Minuten kühl stellen.", "timer": 900}, {"title": "Bestreichen", "text": "Mit 1 verdünnten Eigelb bestreichen. Nach Belieben mit einer Gabel leicht schräg verzieren oder vor dem Bestreichen mit dem Messerrücken Kerben anbringen."}, {"title": "Backen", "text": "Im auf 200 °C vorgeheizten Ofen in der Mitte etwa 10 Minuten backen. Auf die Bräunung achten.", "timer": 600}, {"title": "Auskühlen lassen", "text": "Mailänderli auf einem Gitter auskühlen lassen und in einer Guetzlidose aufbewahren."}]};const EXTRA_RECIPES=[{"id":"spitzbuben","title":"Spitzbuben","category":"Weihnachtsguetzli","unit":"Stück","ingredients":[{"qty":250,"unit":"g","name":"Butter","group":"Zutaten"},{"qty":125,"unit":"g","name":"Puderzucker","group":"Zutaten"},{"qty":2,"unit":"TL","name":"Vanillezucker","group":"Zutaten"},{"qty":1,"unit":"Prise","name":"Salz","group":"Zutaten"},{"qty":1,"unit":"Stück","name":"Eiweiss","group":"Zutaten"},{"qty":350,"unit":"g","name":"Weissmehl","group":"Zutaten"},{"qty":200,"unit":"g","name":"Konfitüre oder Gelee","group":"Zutaten"},{"qty":1,"unit":"Portion","name":"Puderzucker zum Bestäuben","group":"Zutaten"}],"steps":[{"title":"Schritt 1","text":"Butter weich rühren. Zucker, Vanillezucker und Salz beigeben, hell rühren. Eiweiss leicht verklopfen und darunterrühren."},{"title":"Schritt 2","text":"Mehl beigeben, Teig zusammenfügen und zugedeckt etwa 1 Stunde kühl stellen."},{"title":"Schritt 3","text":"30 Minuten vor dem Ausrollen herausnehmen. Zwischen Folie 2 mm dünn ausrollen, 4–5 cm grosse Plätzchen ausstechen; bei der Hälfte die Mitte ausstechen."},{"title":"Schritt 4","text":"Auf Backpapier legen und 15 Minuten kühlen."},{"title":"Schritt 5","text":"Gelee oder Konfitüre erwärmen, glatt rühren und auf die flache Seite der Böden verteilen. Deckeli mit Puderzucker bestäuben und aufsetzen."},{"title":"Backen","text":"Im vorgeheizten Ofen bei 200 °C etwa 6–8 Minuten backen."}],"note":"Füllung nach Wahl: Johannisbeer-/Quittengelee oder Hagebutten-, Orangen-, Aprikosenkonfitüre.","yield":55},{"id":"kirschbuben","title":"Kirschbuben","category":"Weihnachtsguetzli","unit":"Stück","ingredients":[{"qty":250,"unit":"g","name":"Butter","group":"Zu sammenfügen, 30 Minuten kühl stellen."},{"title":"Schritt 3","text":"Kühlen Teig zu fingerdicken Rollen formen, in ca. 2 cm lange Stücke schneiden, bleistiftdick rollen und Hörnchen formen."},{"title":"Schritt 4","text":"Auf Backpapier legen und 15 Minuten kühl stellen."},{"title":"Schritt 5","text":"Puderzucker und Vanillezucker mischen. Noch heisse Hörnchen darin wenden und auskühlen lassen."},{"title":"Backen","text":"Im vorgeheizten Ofen bei 200 °C etwa 10–15 Minuten backen."}],"note":"Bei trockenem Teig optional 1 EL Milch oder ein kleines Eiweiss zugeben.","yield":58},{"id":"zimthoernchen","title":"Zimthörnchen","category":"Weihnachtsguetzli","unit":"Stück","ingredients":[{"qty":250,"unit":"g","name":"Weissmehl","group":"Zutaten"},{"qty":1,"unit":"Prise","name":"Salz","group":"Zutaten"},{"qty":200,"unit":"g","name":"Butter","group":"Zutaten"},{"qty":75,"unit":"g","name":"Puderzucker","group":"Zutaten"},{"qty":1,"unit":"Päckli","name":"Vanillezucker","group":"Zutaten"},{"qty":100,"unit":"g","name":"Mandeln, ungeschält und gemahlen","group":"Zutaten"},{"qty":0.75,"unit":"TL","name":"Zimt","group":"Zutaten"},{"qty":6,"unit":"EL","name":"Puderzucker zum Wenden","group":"Zutaten"},{"qty":1,"unit":"EL","name":"Zimt zum Wenden","group":"Zutaten"}],"steps":[{"title":"Schritt 1","text":"Mehl und Salz mischen. Butter in kleinen Stücken zugeben und mit kalten Händen zu Krümeln reiben."},{"title":"Schritt 2","text":"Puderzucker, Vanillezucker und Mandeln beigeben, Teig zusammenfügen, 30 Minuten kühl stellen."},{"title":"Schritt 3","text":"Kühlen Teig zu fingerdicken Rollen formen, in ca. 2 cm lange Stücke schneiden, bleistiftdick rollen und Hörnchen formen."},{"title":"Schritt 4","text":"Auf Backpapier legen und 15 Minuten kühl stellen."},{"title":"Schritt 5","text":"Noch heisse Hörnchen in Puderzucker und Zimt wenden."},{"title":"Backen","text":"Im vorgeheizten Ofen bei 200 °C etwa 10–15 Minuten backen."}],"note":"","yield":58},{"id":"schokohoernchen","title":"Hörnchen mit Schokolade","category":"Weihnachtsguetzli","unit":"Stück","ingredients":[{"qty":250,"unit":"g","name":"Weissmehl","group":"Zutaten"},{"qty":1,"unit":"Prise","name":"Salz","group":"Zutaten"},{"qty":200,"unit":"g","name":"Butter","group":"Zutaten"},{"qty":75,"unit":"g","name":"Puderzucker","group":"Zutaten"},{"qty":1,"unit":"Päckli","name":"Vanillezucker","group":"Zutaten"},{"qty":100,"unit":"g","name":"Mandeln, geschält und gemahlen","group":"Zutaten"},{"qty":125,"unit":"g","name":"Dunkle Kuchenglasur","group":"Zutaten"}],"steps":[{"title":"Schritt 1","text":"Mehl und Salz mischen. Butter in kleinen Stücken zugeben und mit kalten Händen zu Krümeln reiben."},{"title":"Schritt 2","text":"Puderzucker, Vanillezucker und Mandeln beigeben, Teig zusammenfügen, 30 Minuten kühl stellen."},{"title":"Schritt 3","text":"Kühlen Teig zu fingerdicken Rollen formen, in ca. 2 cm lange Stücke schneiden, bleistiftdick rollen und Hörnchen formen."},{"title":"Schritt 4","text":"Auf Backpapier legen und 15 Minuten kühl stellen."},{"title":"Schritt 5","text":"Hörnchen auskühlen lassen, beide Enden in flüssige dunkle Kuchenglasur tauchen und trocknen lassen."},{"title":"Backen","text":"Im vorgeheizten Ofen bei 200 °C etwa 10–15 Minuten backen."}],"note":"Glasurmenge als Richtwert, da im Original nicht angegeben.","yield":58},{"id":"vanillebrezeli","title":"Vanillebrezeli","category":"Weihnachtsguetzli","unit":"Stück","ingredients":[{"qty":250,"unit":"g","name":"Weissmehl","group":"Zutaten"},{"qty":1,"unit":"Prise","name":"Salz","group":"Zutaten"},{"qty":200,"unit":"g","name":"Butter","group":"Zutaten"},{"qty":75,"unit":"g","name":"Puderzucker","group":"Zutaten"},{"qty":1,"unit":"Päckli","name":"Vanillezucker","group":"Zutaten"},{"qty":100,"unit":"g","name":"Mandeln, geschält und gemahlen","group":"Zutaten"},{"qty":6,"unit":"EL","name":"Puderzucker zum Wenden","group":"Zutaten"},{"qty":1.5,"unit":"Päckli","name":"Vanillezucker zum Wenden","group":"Zutaten"}],"steps":[{"title":"Schritt 1","text":"Mehl und Salz mischen. Butter in kleinen Stücken zugeben und mit kalten Händen zu Krümeln reiben."},{"title":"Schritt 2","text":"Puderzucker, Vanillezucker und Mandeln beigeben, Teig zusammenfügen, 30 Minuten kühl stellen."},{"title":"Schritt 3","text":"Aus dem Teig statt Hörnchen kleine Brezeli formen, 15 Minuten kühlen."},{"title":"Schritt 4","text":"Nach dem Backen noch heiss in der entsprechenden Zucker-Mischung wenden."},{"title":"Backen","text":"Im vorgeheizten Ofen bei 200 °C etwa 10–15 Minuten backen."}],"note":"","yield":58},{"id":"zimtbrezeli","title":"Zimtbrezeli","category":"Weihnachtsguetzli","unit":"Stück","ingredients":[{"qty":250,"unit":"g","name":"Weissmehl","group":"Zutaten"},{"qty":1,"unit":"Prise","name":"Salz","group":"Zutaten"},{"qty":200,"unit":"g","name":"Butter","group":"Zutaten"},{"qty":75,"unit":"g","name":"Puderzucker","group":"Zutaten"},{"qty":1,"unit":"Päckli","name":"Vanillezucker","group":"Zutaten"},{"qty":100,"unit":"g","name":"Mandeln, geschält und gemahlen","group":"Zutaten"},{"qty":0.75,"unit":"TL","name":"Zimt","group":"Zutaten"},{"qty":6,"unit":"EL","name":"Puderzucker zum Wenden","group":"Zutaten"},{"qty":1,"unit":"EL","name":"Zimt zum Wenden","group":"Zutaten"}],"steps":[{"title":"Schritt 1","text":"Mehl und Salz mischen. Butter in kleinen Stücken zugeben und mit kalten Händen zu Krümeln reiben."},{"title":"Schritt 2","text":"Puderzucker, Vanillezucker und Mandeln beigeben, Teig zusammenfügen, 30 Minuten kühl stellen."},{"title":"Schritt 3","text":"Aus dem Teig statt Hörnchen kleine Brezeli formen, 15 Minuten kühlen."},{"title":"Schritt 4","text":"Nach dem Backen noch heiss in der entsprechenden Zucker-Mischung wenden."},{"title":"Backen","text":"Im vorgeheizten Ofen bei 200 °C etwa 10–15 Minuten backen."}],"note":"","yield":58},{"id":"zimtsterne","title":"Zimtsterne mit Glasur","category":"Weihnachtsguetzli","unit":"Stück","ingredients":[{"qty":3,"unit":"Stück","name":"Eiweiss","group":"Zutaten"},{"qty":1,"unit":"Pris function showShopping(){const all=totals(),egg=eggSummary(all),items=all.filter(x=>!['ei (ganz)','ei','eier','eier (ganz)','eiweiss','eiweiß','eigelb'].includes(x.name.toLowerCase().trim()));let eggUsed=egg.total>0;let text=`<h2>Einkaufsliste</h2><p class="muted">Gleiche Zutaten und Einheiten werden automatisch zusammengezählt. Bereits vorhandene Zutaten kannst du abhaken.</p>`;if(!all.length){$('content').innerHTML=text+'<div class="card">Wähle zuerst Rezepte in der Backplanung aus.</div>';return}if(eggUsed)text+=`<div class="card"><h3>🥚 Eier clever nutzen</h3><p><strong>${egg.total} Eier insgesamt</strong> (rechnerischer Mindestbedarf)</p><p>${fmt(egg.whole)} ganze Eier für Rezepte; zusätzlich ${egg.additional} Eier zum Trennen für ${fmt(egg.white)} Eiweiss und ${fmt(egg.yolk)} Eigelb.</p><p class="small muted">Aus den getrennten Eiern bleiben rechnerisch ${fmt(egg.whiteLeft)} Eiweiss und ${fmt(egg.yolkLeft)} Eigelb übrig. Annahme: ein Ei liefert ein Eiweiss und ein Eigelb. Bei Grammangaben oder unterschiedlichen Eiergrössen separat prüfen.</p></div>`;text+=`<div class="card"><h3>Zutaten</h3>${(eggUsed?[{name:'Eier (gesamt)',unit:'Stück',qty:egg.total}]:[]).concat(items).map((x,i)=>{let key=x.name+'|'+x.unit;return `<label class="check"><input type="checkbox" ${state.checked[key]?'checked':''} onchange="toggleCheck('${encodeURIComponent(key)}',this.checked)"><span>${fmt(x.qty)} ${esc(x.unit)} ${esc(x.name)}</span></label>`}).join('')}</div><div class="row"><button onclick="copyShopping()">📋 Liste kopieren</button><button class="alt" onclick="window.print()">🖨 Drucken</button></div>`;$('content').innerHTML=text}
function toggleCheck(encoded,checked){state.checked[decodeURIComponent(encoded)]=checked;save()}function shoppingText(){let rows=totals(),egg=eggSummary(rows),items=rows.filter(x=>!['ei (ganz)','ei','eier','eier (ganz)','eiweiss','eiweiß','eigelb'].includes(x.name.toLowerCase().trim()));return 'Einkaufsliste – Mein Backbuch\n'+(egg.total?`${egg.total} Stück Eier (inkl. ${egg.additional} zum Trennen)\n`:'')+items.map(x=>`${fmt(x.qty)} ${x.unit} ${x.name}`).join('\n')}async function copyShopping(){let s=shoppingText();try{await navigator.clipboard.writeText(s);alert('Einkaufsliste kopiert')}catch(e){prompt('Einkaufsliste zum Kopieren:',s)}}
function editRecipe(id){editing=id||null;let r=id?recipe(id):null;$('content').innerHTML=`<h2>${r?'Rezept bearbeiten':'Neues Rezept'}</h2><div class="card"><label class="field">Rezeptname</label><input class="full" id="name" value="${esc(r?.title||'')}"><label class="field">Anzahl Stück pro Grundrezept</label><input type="number" id="yield" min="1" value="${r?.yield||40}"><label class="field">Kategorie</label><input class="full" id="category" value="${esc(r?.category||'Weihnachtsguetzli')}"><h3>Zutaten</h3><p class="small muted">Eine Zutat pro Zeile, im Format: Menge | Einheit | Zutat. Beispiel: 3 | Stück | Eiweiss. Bitte «Ei (ganz)», «Eiweiss» oder «Eigelb» exakt so benennen, damit die Eierberechnung funktioniert.</p><textarea id="ingredients" style="min-height:190px">${esc(r?.ingredients.map(i=>`${i.qty} | ${i.unit} | ${i.name}`).join('\n')||'')}</textarea><h3>Arbeitsschritte</h3><p class="small muted">Jeden Schritt durch eine Leerzeile trennen.</p><textarea id="steps" style="min-height:220px">${esc(r?.steps.map(s=>s.text).join('\n\n')||'')}</textarea><div class="row"><button onclick="saveEdited()">Rezept speichern</button><button class="alt" onclick="navigate('recipes')">Abbrechen</button></div></div>`}
function saveEdited(){const title=$('name').value.trim(),yieldN=Number($('yield').value),lines=$('ingredients').value.trim().split('\n').filter(x=>x.trim()),steps=$('steps').value.trim().split(/\n\s*\n/).filter(Boolean);let ingredients=[];for(const line of lines){let bits=line.split('|').map(x=>x.trim());if(bits.length!==3||!Number.isFinite(Number(bits[0]))||Number(bits[0])<=0||!bits[1]||!bits[2]){alert('Zutat ungültig: '+line+'\nFormat: 150 | g | Butter');return}ingredients.push({qty:Number(bits[0]),unit:bits[1],name:bits[2],group:'Zutaten'})}if(!title||!yieldN||yieldN<1||!ingredients.length||!steps.length){alert('Bitte Rezeptname, Stückzahl, Zutaten und Arbeitsschritte eingeben.');return}let id=editing||'r'+Date.now(),r={id,title,yield:yieldN,unit:'Stück',category:$('category').value,image:editing?recipe(id)?.image:undefined,ingredients,steps:steps.map((text,i)=>({title:'Schritt '+(i+1),text}))};state.recipes=editing?state.recipes.map(x=>x.id===id?r:x):[...state.recipes,r];save();showRecipe(id)}
function showData(){$('content').innerHTML=`<h2>Sicherung & Daten</h2><div class="card"><h3>Backbuch sichern</h3><p>Exportiere deine Rezepte, Backplanung und Einkaufsliste als JSON-Datei. Bewahre sie beispielsweise in iCloud Drive auf.</p><button onclick="exportData()">⬇ Sicherung herunterladen</button></div><div class="card"><h3>Sicherung wiederherstellen</h3><p class="warning">Achtung: Beim Einlesen werden alle aktuellen Rezepte und Planungen ersetzt.</p><input type="file" accept=".json,application/json" onchange="importData(event)"></div><div class="card"><h3>Datenschutz & Synchronisierung</h3><p>Die App benötigt für die Bedienung keine Anmeldung. Die Daten liegen ausschliesslich im lokalen Browser-Speicher dieses Geräts; andere Geräte werden nicht automatisch synchronisiert. Die veröffentlichte Webseite selbst ist ohne Zugangsschutz grundsätzlich über ihren Link erreichbar.</p></div>`}function exportData(){let b=new Blob([JSON.stringify({version:3,...state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Backbuch-Sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(e){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.recipes)||!data.recipes.every(r=>r.title&&Array.isArray(r.ingredients)&&Array.isArray(r.steps)))throw Error('Ungültige Sicherung');if(!confirm('Alle vorhandenen Rezepte und Planungen ersetzen?'))return;state={recipes:data.recipes,plan:data.plan||{},checked:data.checked||{}};save();navigate('recipes')}catch(err){alert('Sicherung konnte nicht gelesen werden: '+err.message)}}
navigate('recipes');
</script></body></html>
